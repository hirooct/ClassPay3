<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== 全画面基本（HOMEと同系統） ===== */
html, body{ margin:0; padding:0; width:100%; height:100%; }
body{
  min-height:100svh;
  background: linear-gradient(180deg, #f5f9ff, #eef3fb);
  color:#1f2937;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
}

.app{
  min-height:100svh;
  display:flex;
  flex-direction:column;
}

/* ===== ヘッダー（HOMEと同系統） ===== */
.posHeader{
  position:sticky;
  top:0;
  z-index:10;

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;

  padding: calc(14px + env(safe-area-inset-top)) 14px 14px;
  background: rgba(255,255,255,.88);
  backdrop-filter: blur(12px);
  border-bottom:1px solid #dbeafe;

  max-width:2400px;
  margin:0 auto;
  width:100%;
  box-sizing:border-box;
}

.brand{ display:flex; align-items:center; gap:12px; min-width:0; }
.logo{
  width:44px; height:44px;
  border-radius:16px;
  display:grid; place-items:center;
  background:#e0ecff;
  box-shadow: 0 8px 18px rgba(30,64,175,.18);
  font-size:22px;
}
.title{ font-size:22px; font-weight:900; color:#1e3a8a; }
.sub{
  font-size:12px; color:#475569;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:55vw;
}

.status{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
.pill{
  font-size:12px; font-weight:800;
  padding:8px 12px;
  border-radius:999px;
  background:#e0ecff;
  color:#1e40af;
  border:1px solid #bfdbfe;
}
.time{
  font-size:16px; font-weight:900;
  color:#1f2937;
  font-variant-numeric: tabular-nums;
}

/* ===== メイン ===== */
.main{
  flex:1;
  padding:14px;
  padding-bottom: calc(14px + env(safe-area-inset-bottom));
  max-width:2400px;
  margin:0 auto;
  width:100%;
  box-sizing:border-box;
}

/* ===== 共通カード ===== */
.card{
  border-radius:20px;
  padding:18px;
  background:#ffffff;
  border:1px solid #dbeafe;
  box-shadow: 0 14px 28px rgba(30,64,175,.12);
}
.lookupShell{background:linear-gradient(145deg,#ffffff 55%,#eff6ff);overflow:hidden}.lookupHero{display:flex;align-items:center;gap:14px;margin-bottom:16px}.lookupHeroIcon{width:58px;height:58px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,#2563eb,#1e3a8a);color:#fff;font-size:27px;box-shadow:0 12px 26px rgba(37,99,235,.25)}.shop-list-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.shop-list-item{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid #dbeafe;border-radius:16px;background:#fff;cursor:pointer;transition:.16s ease}.shop-list-item:hover{transform:translateY(-2px);border-color:#60a5fa;box-shadow:0 10px 20px rgba(30,64,175,.1)}.shop-list-id{min-width:58px;padding:7px;border-radius:10px;background:#e0ecff;color:#1e40af;text-align:center;font-weight:900}.companyHero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:20px;border-radius:18px;background:linear-gradient(135deg,#1d4ed8,#1e3a8a);color:#fff}.companyHero .shop-title{color:#fff;font-size:25px}.companyHero .shop-id{color:#dbeafe}.companyBalance{text-align:right}.companyBalance .label{font-size:12px;font-weight:800;color:#bfdbfe}.companyBalance .amount{color:#fff;font-size:34px}.companyBody{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.8fr);gap:14px;margin-top:14px}.payLinkCard{padding:16px;border-radius:16px;background:#f8fbff;border:1px solid #dbeafe}
.card h1{
  margin:0 0 6px 0;
  font-size:22px;
  font-weight:900;
  color:#1e3a8a;
}
.muted{ color:#64748b; font-size:13px; margin:0; }
label{
  display:block;
  margin-top:12px;
  font-size:12px;
  font-weight:900;
  color:#334155;
}

/* ===== 入力 ===== */
input, select{
  width:100%;
  box-sizing:border-box;
  margin-top:6px;
  padding:12px 12px;
  border-radius:14px;
  border:1px solid #bfdbfe;
  background:#f8fbff;
  color:#0f172a;
  font-size:16px;
  outline:none;
}
input:focus, select:focus{
  border-color:#60a5fa;
  box-shadow: 0 0 0 4px rgba(59,130,246,.15);
}
.mono{
  font-variant-numeric: tabular-nums;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
}

/* ===== ボタン（a.btn） ===== */
.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}
a.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;

  text-decoration:none;
  border-radius:16px;
  padding:12px 14px;
  font-size:16px;
  font-weight:900;

  border:1px solid #bfdbfe;
  background:#e0ecff;
  color:#1e40af;
  box-shadow: 0 10px 22px rgba(30,64,175,.14);
  touch-action: manipulation;
}
a.btn:active{ transform: scale(.99); }

a.btn.primary{
  background:#1a73e8;
  color:#fff;
  border-color:#1a73e8;
}
a.btn.secondary{
  background:#ffffff;
  color:#1e40af;
  border-color:#bfdbfe;
}

/* ===== メッセージ ===== */
.err{
  margin:10px 0 0 0;
  padding:10px 12px;
  border-radius:14px;
  background:#fee2e2;
  border:1px solid #fca5a5;
  color:#991b1b;
  font-weight:800;
}
.ok{
  margin:10px 0 0 0;
  padding:10px 12px;
  border-radius:14px;
  background:#dcfce7;
  border:1px solid #86efac;
  color:#166534;
  font-weight:900;
}

/* ===== 会社情報カード内 ===== */
.shop-card{ margin-top:14px; }
.shop-title{
  font-size:18px;
  font-weight:900;
  color:#1e3a8a;
  display:flex;
  align-items:baseline;
  gap:8px;
  flex-wrap:wrap;
}
.shop-id{ font-size:12px; color:#64748b; font-weight:900; }

.shop-balance{
  margin-top:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:12px;
  border-radius:16px;
  border:1px solid #bfdbfe;
  background: linear-gradient(180deg, #e0ecff, #f4f8ff);
}
.shop-balance .label{
  margin:0;
  font-size:12px;
  font-weight:900;
  color:#1e3a8a;
}
.amount{
  font-size:22px;
  font-weight:900;
  color:#0f172a;
}

hr{
  border:0;
  border-top:1px solid #e2e8f0;
  margin:14px 0;
}

/* URL表示 */
.url a{
  word-break: break-all;
  color:#1a73e8;
  font-weight:900;
  text-decoration:none;
}
.url a:active{ opacity:.8; }

/* ===== details（給与支払いの折りたたみ） ===== */
details.card{
  padding:14px;
}
details > summary{
  cursor:pointer;
  list-style:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
details > summary::-webkit-details-marker{ display:none; }

.sumLeft{
  display:flex;
  align-items:baseline;
  gap:8px;
  flex-wrap:wrap;
}
.chev{
  width:28px; height:28px;
  border-radius:999px;
  display:grid; place-items:center;
  border:1px solid #bfdbfe;
  background:#e0ecff;
  color:#1e40af;
  font-weight:900;
  flex-shrink:0;
}
details[open] .chev{ transform: rotate(180deg); }

/* 給与入力行 */
.pay-row select{ flex:1; min-width: 180px; }
.pay-row input{ width: 120px; }

/* ===== loading skeleton ===== */
.skel{
  background: #eee;
  border-radius: 10px;
  position: relative;
  overflow: hidden;
}
.skel::after{
  content:"";
  position:absolute;
  top:0; left:-40%;
  width:40%; height:100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent);
  animation: skelMove 1.1s infinite;
}
@keyframes skelMove{ 0%{ left:-40%; } 100%{ left:100%; } }

.loading-card .shop-title{ margin-bottom: 10px; }
.loading-card .skel-line{ height: 14px; margin: 10px 0; }
.loading-card .skel-title{ height: 22px; width: 70%; }
.loading-card .skel-amt{ height: 30px; width: 40%; }
.loading-card .skel-url{ height: 14px; width: 95%; }

@media (max-width: 420px){
  .pay-row input{ width: 110px; }
}
@media (max-width:700px){.companyHero,.companyBody{grid-template-columns:1fr}.companyBalance{text-align:left}.companyBalance .amount{font-size:29px}.lookupHeroIcon{width:50px;height:50px}}
</style>
</head>

<body>
<div class="app">

  <header class="posHeader">
    <div class="brand">
      <div class="logo">💎</div>
      <div style="min-width:0">
        <div class="title">ClassPay</div>
        <div class="sub">学級内通貨のデジタル決済　クラスペイ</div>
      </div>
    </div>
    <div class="status">
      <div class="pill">会社（係）</div>
      <div class="time" id="nowTime">--:--</div>
    </div>
  </header>

  <main class="main">
    <div class="card lookupShell">
      <div class="lookupHero"><div class="lookupHeroIcon">🏢</div><div><h1>会社照会</h1><p class="muted">会社の残高確認、支払いページの共有、給与送金をまとめて行えます。</p></div></div>

<div id="shopListArea" class="card" style="margin-top:14px; margin-bottom:14px">
  <div class="shop-title">会社一覧</div>
  <p class="muted">会社IDを確認して入力してください。</p>
  <div id="shopList" class="shop-list-grid" style="margin-top:10px">読み込み中...</div>
</div>

      <label>会社ID（例：S001）</label>
      <input id="shopId" class="mono" placeholder="S001" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">

      <div class="row" style="margin-top:12px">
        <a href="#" id="btnLookup" class="btn primary">照会</a>
        <a href="#" id="btnBackHome" class="btn secondary">戻る</a>
      </div>

      <div id="resultArea"></div>
      <div id="msg"></div>
    </div>
  </main>
</div>

<script>
let BASE = "";

/* ===== 共通 ===== */
function buildUrl(p, params){
  if(!BASE) return "#";
  const url = new URL(BASE);
  url.searchParams.set("p", p);
  if (params && typeof params === "object") {
    Object.keys(params).forEach(key => {
      const val = params[key];
      if (val !== undefined && val !== null && val !== "") {
        url.searchParams.set(key, String(val));
      }
    });
  }
  return url.toString();
}

function escapeHtml_(s){
  return String(s)
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function showErr(e){
  document.getElementById("msg").innerHTML = `<p class="err">${escapeHtml_(e.message || e)}</p>`;
}
function clearMsg(){
  document.getElementById("msg").innerHTML = "";
}

/* ===== 時計 ===== */
function tick(){
  const d = new Date();
  const hh = String(d.getHours()).padStart(2,"0");
  const mm = String(d.getMinutes()).padStart(2,"0");
  document.getElementById("nowTime").textContent = `${hh}:${mm}`;
}
tick();
setInterval(tick, 1000);

/* ===== GAS呼び出し wrapper ===== */
function call(name, payload){
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)[name](payload);
  });
}
async function loadShopList_(){
  const box = document.getElementById("shopList");
  if (!box) return;

  try{
    const shops = await call("api_shopList");

    if (!Array.isArray(shops) || shops.length === 0){
      box.innerHTML = `<p class="muted">表示できる会社がありません。</p>`;
      return;
    }

    box.innerHTML = shops.map(s => `
      <div class="shop-list-item" onclick="selectShopId('${escapeHtml_(s.shopId)}')">
        <span class="shop-list-id mono">${escapeHtml_(s.shopId)}</span>
        <span style="font-weight:900">${escapeHtml_(s.shopName)}</span>
      </div>
    `).join("");

  }catch(err){
    box.innerHTML = `<p class="err">会社一覧の読み込みに失敗しました。</p>`;
  }
}

/* クリックでID入力 */
function selectShopId(id){
  const input = document.getElementById("shopId");
  if (!input) return;
  input.value = id;
}


/* ===== BASE_URL 読み込み ===== */
function loadBase_(){
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(function(baseUrl){
        let v = String(baseUrl || "").trim();
        if (!v) {
          reject(new Error("BASE_URL が空です。"));
          return;
        }
        v = v.replace(/\?p=.*$/, "");
        v = v.replace(/\?$/, "");
        BASE = v;
        resolve(BASE);
      })
      .withFailureHandler(reject)
      .getBaseUrlForClient();
  });
}

/* ====== 照会中トグル ====== */
function lookupBusy_(busy){
  const btn = document.getElementById("btnLookup");
  if (!btn) return;
  btn.style.pointerEvents = busy ? "none" : "auto";
  btn.style.opacity = busy ? "0.7" : "1";
  btn.textContent = busy ? "照会中..." : "照会";
}

/* ====== 結果カード内ローディング ====== */
function renderLookupLoadingCard_(shopId){
  document.getElementById("resultArea").innerHTML = `
    <div class="card shop-card loading-card" aria-busy="true">
      <div class="shop-title">
        <div class="skel skel-title"></div>
      </div>

      <div class="shop-balance">
        <div class="label">残高</div>
        <div class="amount mono"><div class="skel skel-amt"></div></div>
      </div>

      <hr>

      <div class="muted">支払いURL</div>
      <div class="mono url" style="margin-top:6px">
        <div class="skel skel-url"></div>
        <div class="skel skel-url" style="width:85%"></div>
      </div>

      <div class="muted" style="margin-top:12px">給与支払い</div>
      <div class="skel skel-line" style="width:60%"></div>
      <div class="skel skel-line" style="width:90%"></div>
      <div class="skel skel-line" style="width:80%"></div>

      <div class="muted" style="margin-top:12px">照会中...</div>
    </div>
  `;
}

function setSalaryMsg_(html){
  const box = document.getElementById("salaryMsg");
  if (box) box.innerHTML = html || "";
}
function salaryBusy_(busy){
  const btn = document.getElementById("btnSalarySend");
  if (!btn) return;
  btn.style.pointerEvents = busy ? "none" : "auto";
  btn.style.opacity = busy ? "0.7" : "1";
  btn.textContent = busy ? "送金中..." : "送金";
}
function findDup_(arr){
  const s = new Set();
  for (const x of arr){
    if (s.has(x)) return x;
    s.add(x);
  }
  return null;
}

let USER_NAME_MAP = {};

function setShopBalance_(bal){
  const el = document.getElementById("shopBalance");
  if (!el) return;
  el.textContent = (bal === null || bal === undefined) ? "" : String(bal);
}

async function renderSalaryCard_(shopId){
  const salaryArea = document.getElementById("salaryArea");
  if (!salaryArea) return;

  salaryArea.innerHTML = `<div class="muted" style="margin-top:12px">給与支払いを読み込み中...</div>`;

  const members = await call("api_companyMembers", shopId);

  if (!Array.isArray(members) || members.length === 0){
    salaryArea.innerHTML = `
      <div class="card" style="margin-top:12px">
        <div class="shop-title">給与支払い</div>
        <p class="muted" style="margin-top:8px">支払い先候補がありません。</p>
      </div>
    `;
    return;
  }

  USER_NAME_MAP = {};
  members.forEach(m => {
    const id = String(m.userId || "").trim().toUpperCase();
    if (!id) return;
    USER_NAME_MAP[id] = String(m.name || "").trim();
  });

  const opts = [`<option value="">（選択）</option>`]
    .concat(members.map(m =>
      `<option value="${escapeHtml_(m.userId)}">${escapeHtml_(m.name)}（${escapeHtml_(m.userId)}）</option>`
    ))
    .join("");

  const rowsHtml = Array.from({length:5}).map((_,i)=>`
    <div class="row pay-row" style="margin-top:10px">
      <select class="payTo" data-i="${i}">
        ${opts}
      </select>
      <input class="payAmt mono" data-i="${i}" type="number" inputmode="numeric"
             min="0" step="1" placeholder="金額">
    </div>
  `).join("");

  salaryArea.innerHTML = `
  <details class="card" style="margin-top:12px" id="salaryDetails">
    <summary>
      <span class="sumLeft">
        <span class="shop-title" style="margin:0">給与支払い</span>
        <span class="muted" style="font-size:12px">（タップで開閉）</span>
      </span>
      <span class="chev">⌄</span>
    </summary>

    <div style="margin-top:10px">
      <p class="muted">支払い先を選び、金額を入力して送金（最大5人）。</p>

      ${rowsHtml}

      <label style="margin-top:12px">会社PASS（送金時に必要）</label>
      <input id="companyPass" type="password" class="mono"
        autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false"
        placeholder="PASSを入力">

      <div class="row" style="margin-top:12px">
        <a href="#" id="btnSalarySend" class="btn primary">送金</a>
        <a href="#" id="btnSalaryClear" class="btn secondary">クリア</a>
      </div>

      <div id="salaryMsg" style="margin-top:10px"></div>
    </div>
  </details>
  `;

  document.getElementById("btnSalarySend").addEventListener("click", async (e)=>{
    e.preventDefault();
    await salarySend_(shopId);
  });

  document.getElementById("btnSalaryClear").addEventListener("click", (e)=>{
    e.preventDefault();
    salaryArea.querySelectorAll(".payTo").forEach(el => el.value = "");
    salaryArea.querySelectorAll(".payAmt").forEach(el => el.value = "");
    const passEl = document.getElementById("companyPass");
    if (passEl) passEl.value = "";
    setSalaryMsg_("");
  });
}

async function salarySend_(shopId){
  try{
    setSalaryMsg_("");
    salaryBusy_(true);

    const area = document.getElementById("salaryArea");
    const tos  = Array.from(area.querySelectorAll(".payTo")).map(el => el.value);
    const amts = Array.from(area.querySelectorAll(".payAmt")).map(el => el.value);

    const passEl = document.getElementById("companyPass");
    const companyPass = (passEl?.value || "").trim();
    if (!companyPass) throw new Error("会社PASSを入力してください");

    const items = [];
    for (let i=0; i<5; i++){
      const to = (tos[i] || "").trim();
      const amtRaw = (amts[i] || "").trim();

      if (!to && !amtRaw) continue;

      if (!to) throw new Error(`支払い先が未選択の行があります（${i+1}行目）`);
      const amt = Number(amtRaw);
      if (!Number.isFinite(amt) || amt <= 0) throw new Error(`金額が正しくありません（${i+1}行目）`);
      if (!Number.isInteger(amt)) throw new Error(`金額は整数で入力してください（${i+1}行目）`);
      items.push({ to, amount: amt });
    }
    if (items.length === 0) throw new Error("送金する行がありません");

    const dup = findDup_(items.map(x => x.to));
    if (dup) throw new Error(`同じ支払い先が重複しています：${dup}`);

    const res = await call("api_salaryPayBatch", { shopId, companyPass, items });
    if (!res || res.ok !== true) throw new Error(res?.message || "送金に失敗しました");

    if (res.shop && ("balance" in res.shop)) {
      setShopBalance_(res.shop.balance);
    } else {
      const info = await call("api_shopInfo", shopId);
      setShopBalance_(info.balance);
    }

    const lines = (res.results || items).map(r=>{
      const uid = String(r.to || "").trim().toUpperCase();
      const name = USER_NAME_MAP[uid] || "不明";
      const label = `${escapeHtml_(name)}（${escapeHtml_(uid)}）`;
      const amt = escapeHtml_(String(r.amount ?? ""));
      const ok = (r.ok !== false);
      const msg = r.message ? `：${escapeHtml_(r.message)}` : "";
      return `<li>${ok ? "完了" : "失敗"} ${label} に ${amt} 送金${msg}</li>`;
    }).join("");

    setSalaryMsg_(`<div class="ok"><ul style="margin:0; padding-left:18px">${lines}</ul></div>`);

  }catch(err){
    setSalaryMsg_(`<p class="err">${escapeHtml_(err.message || String(err))}</p>`);
  }finally{
    const passEl = document.getElementById("companyPass");
    if (passEl) passEl.value = "";
    salaryBusy_(false);
  }
}

document.getElementById("btnLookup").addEventListener("click", async (e)=>{
  e.preventDefault();
  clearMsg();

  const shopId = document.getElementById("shopId").value.trim().toUpperCase();
  if (!shopId) {
    showErr("会社IDを入力してください");
    return;
  }

  lookupBusy_(true);
  renderLookupLoadingCard_(shopId);

  try{
    const info = await call("api_shopInfo", shopId);

    const payUrl = buildUrl("pay", {
      shopId: info.shopId,
      v: Date.now()
    });

    document.getElementById("resultArea").innerHTML = `
      <div class="card shop-card">
        <div class="companyHero"><div><div class="shop-title">${escapeHtml_(info.shopName)} <span class="shop-id">${escapeHtml_(info.shopId)}</span></div><div style="margin-top:7px;color:#dbeafe;font-size:13px">ClassPay 会社アカウント</div></div><div class="companyBalance"><div class="label">現在の残高</div><div class="amount mono"><span id="shopBalance">${escapeHtml_(info.balance)}</span> <small>Pay</small></div></div></div>
        <div class="companyBody"><div class="payLinkCard"><div class="shop-title">💳 支払いを受け取る</div><p class="muted" style="margin-top:7px">下の専用ページを開くか、児童へ共有してください。</p><div class="mono url" style="margin-top:10px"><a href="${escapeHtml_(payUrl)}">${escapeHtml_(payUrl)}</a></div><div class="row" style="margin-top:12px"><a class="btn primary" href="${escapeHtml_(payUrl)}">支払いページを開く</a></div></div><div id="salaryArea"></div></div>
      </div>
    `;

    await renderSalaryCard_(info.shopId);

  }catch(err){
    showErr(err);
    document.getElementById("resultArea").innerHTML = "";
  }finally{
    lookupBusy_(false);
  }
});

/* ===== 初期化 ===== */
(async function init(){
  try{
    await loadBase_();
    document.getElementById("btnBackHome").href = buildUrl("home");

    await loadShopList_(); // ←これ追加

  }catch(err){
    console.error(err);
    showErr(err.message || "BASE_URL の読み込みに失敗しました。");
    document.getElementById("btnLookup").style.pointerEvents = "none";
    document.getElementById("btnLookup").style.opacity = "0.6";
    document.getElementById("btnBackHome").href = "#";
  }
})();
</script>

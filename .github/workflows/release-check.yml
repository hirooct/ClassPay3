name: Release manifest check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          for file in *.js updater/*.js; do node --check "$file"; done
      - name: Validate release checksums
        run: node tools/verify_release.mjs

<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f5f9ff,#eef3fb);font-family:system-ui,-apple-system,"BIZ UDPGothic",sans-serif;color:#1f2937}.head{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:14px;background:#ffffffdf;backdrop-filter:blur(12px);border-bottom:1px solid #dbeafe}.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;color:#1e3a8a}.logo{width:44px;height:44px;display:grid;place-items:center;border-radius:15px;background:#e0ecff}.headActions{display:flex;align-items:center;gap:8px}.pill{padding:7px 11px;border:1px solid #bfdbfe;border-radius:999px;background:#e0ecff;color:#1e40af;font-size:12px;font-weight:900}.homeBtn{width:auto;margin:0;padding:9px 12px;background:#fff;color:#1e40af;border:1px solid #93c5fd;text-decoration:none;border-radius:12px;font-size:13px;font-weight:900;white-space:nowrap}.main{max-width:1200px;margin:auto;display:grid;gap:16px;padding:16px}.card{background:#fff;border:1px solid #dbeafe;border-radius:20px;padding:18px;box-shadow:0 10px 24px #1e40af18}h2{margin:0 0 14px;color:#1e3a8a;font-size:20px}h3{margin:16px 0 8px}label{display:block;font-size:13px;font-weight:800;margin:10px 0 5px}input,select,textarea,button{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;font:inherit}button{background:#2563eb;color:white;border:0;font-weight:900;margin-top:12px;cursor:pointer}.sell{background:#f59e0b;color:#422006}.danger{background:#dc2626}.smallBtn{width:auto;padding:7px 10px;margin:0;font-size:12px}.balance{font-size:42px;font-weight:900;color:#2563eb}.chip{display:inline-block;padding:7px 10px;margin:4px;border-radius:999px;background:#e0ecff;color:#1e40af;font-weight:800}.msg{margin-top:10px;font-weight:800}.err{color:#b91c1c}.ok,.plus{color:#15803d}.minus{color:#dc2626}.hidden{display:none}.rank{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:8px;align-items:center;padding:11px 4px;border-bottom:1px solid #e2e8f0}.history{display:grid;gap:10px}.membership{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #e2e8f0}.tx{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px;border:1px solid #e2e8f0;border-radius:15px;background:#f8fafc}.txIcon{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:#e0ecff;font-size:21px}.txTitle{font-weight:900;color:#0f172a}.txMeta{margin-top:3px;color:#64748b;font-size:12px}.txAmount{text-align:right;font-size:18px;font-weight:900;white-space:nowrap}.stockQuote{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.quote{padding:12px 6px;text-align:center;border-radius:14px;background:#f1f5f9}.quote b{display:block;font-size:20px;color:#1e3a8a}.tradeButtons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tradeButtons button{margin-top:10px}.loading{color:#64748b}.wide{grid-column:1/-1}.memberBox{max-height:290px;overflow:auto;border:1px solid #cbd5e1;border-radius:14px;padding:8px;background:#f8fafc}.memberOption{display:flex;align-items:center;gap:10px;margin:0;padding:10px;border-bottom:1px solid #e2e8f0;cursor:pointer}.memberOption:last-child{border-bottom:0}.memberOption:has(input:checked){background:#dbeafe;border-radius:10px;color:#1e3a8a}.memberOption input{width:22px;height:22px;flex:0 0 auto;margin:0;accent-color:#2563eb}.memberName{font-weight:800}.selectionSummary{margin-top:8px;padding:10px;border-radius:12px;background:#e0ecff;color:#1e40af;font-size:13px;font-weight:800}@media(min-width:800px){.main{grid-template-columns:1fr 1fr}}@media(max-width:560px){.tx{grid-template-columns:44px minmax(0,1fr)}.txAmount{grid-column:2;text-align:left}.stockQuote{grid-template-columns:1fr}.head .pill{display:none}.homeBtn{padding:9px}}
/* ワイド画面では横幅を広く使用 */
.main{max-width:2400px;width:calc(100% - 16px)}
.civicGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.civicBox{padding:14px;border:1px solid #dbeafe;border-radius:16px;background:#f8fbff}.civicBox h3{margin-top:0;color:#1e3a8a}.notice{padding:10px 0;border-bottom:1px solid #e2e8f0}.rule{padding:13px;border:1px solid #dbeafe;border-radius:14px;background:#fff;margin-top:10px}.ruleActions{display:flex;gap:7px;flex-wrap:wrap}.ruleActions button{width:auto;flex:1;min-width:80px;padding:8px;margin-top:7px}.budget{font-size:28px;font-weight:900;color:#1e3a8a}.policy{margin-top:10px;padding:10px;border-radius:12px;background:#fff7ed;color:#7c2d12;font-size:12px;line-height:1.7}
</style></head><body>
<header class="head"><div class="brand"><span class="logo">💎</span><span>ClassPay</span></div><div class="headActions"><div class="pill">残高・株式・会社申請</div><a class="homeBtn" id="btnBackHome" href="#">⌂ ホームへ戻る</a></div></header>
<main class="main">
 <section class="card"><h2>残高を確認</h2><label>ユーザー</label><select id="uid"><option value="">読み込み中…</option></select><label>4桁PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="PINを入力"><button onclick="login()">確認する</button><div id="loginMsg" class="msg"></div></section>
 <section id="profile" class="card hidden"><h2 id="userName">本人情報</h2><div class="balance"><span id="userBalance">0</span> <small>Pay</small></div><h3>現在の所属会社</h3><div id="companies"></div><h3>提出した退職届</h3><div id="retirementApplications"></div><h3>所属履歴</h3><div id="membershipHistory"></div></section>
 <section id="stock" class="card hidden"><h2>📈 株の売買</h2><label>会社</label><select id="stockShop" onchange="loadStock()"></select><div id="stockInfo" class="loading">会社を選んでください</div><label>売買する株数</label><input id="shares" type="number" inputmode="numeric" min="1" step="1" value="1"><div class="tradeButtons"><button onclick="trade('BUY')">株を買う</button><button class="sell" onclick="trade('SELL')">株を売る</button></div><div id="stockMsg" class="msg"></div></section>
 <section id="application" class="card hidden"><h2>🏢 会社設立申請</h2><label>会社名</label><input id="companyName" maxlength="40"><label>活動内容</label><textarea id="activity" rows="3" maxlength="300"></textarea><label>会社PASS（4〜12桁）</label><input id="companyPass" type="password" inputmode="numeric"><label>社員を選択（複数選択できます）</label><div id="members" class="memberBox"></div><div id="memberSummary" class="selectionSummary">選択中：0人</div><button onclick="submitApplication()">先生へ申請する</button><div id="appMsg" class="msg"></div></section>
 <section id="civicCard" class="card wide hidden"><h2>🏛️ お知らせ・クラス国会</h2><div class="civicGrid"><div class="civicBox"><h3>やること</h3><div id="civicTasks" class="loading">読み込み中…</div><h3>お知らせ</h3><div id="civicNotices"></div></div><div class="civicBox"><h3>政府のお金</h3><div id="civicBudget"></div></div></div><h3>ルール提案と投票</h3><div id="civicRules"></div><details class="rule"><summary><b>新しいルールを提案する</b></summary><label>提案するルール</label><input id="ruleTitle" maxlength="80"><label>なぜ必要ですか</label><textarea id="ruleReason" rows="2" maxlength="500"></textarea><label>どんなよいことがありますか</label><textarea id="ruleBenefit" rows="2" maxlength="500"></textarea><label>心配な点（任意）</label><textarea id="ruleConcern" rows="2" maxlength="500"></textarea><button onclick="submitRuleProposal()">先生へ提案する</button><div id="ruleMsg" class="msg"></div></details></section>
 <section class="card wide"><h2>🏆 会社ランキング</h2><div id="ranking" class="loading">読み込み中…</div></section>
 <section id="historyCard" class="card wide hidden"><h2>🧾 取引履歴</h2><div id="history" class="history"></div></section>
</main><script>
let current=null,users=[],shops=[],currentQuote=null,BASE='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={PAY:'支払い',GOV_PAY:'政府への支払い',SALARY:'給与',TAX:'税金',ADJUST:'残高調整',DISTRIB:'配付',INTEREST_B:'利息',INTEREST_S:'会社利息',SHOP_ADJ:'会社調整',SHOP_DIST:'会社支援金',SHOP_WD:'会社引き出し',STOCK_BUY:'株購入',STOCK_SELL:'株売却'};
const icons={PAY:'💳',GOV_PAY:'🏛️',SALARY:'💼',TAX:'🏛️',ADJUST:'⚙️',DISTRIB:'🎁',INTEREST_B:'✨',INTEREST_S:'✨',SHOP_ADJ:'⚙️',SHOP_DIST:'🏢',SHOP_WD:'🏢',STOCK_BUY:'📈',STOCK_SELL:'📉'};
function msg(id,text,ok){const e=document.getElementById(id);e.textContent=text;e.className='msg '+(ok?'ok':'err')}
function signedAmount(tx){const type=String(tx.type||'').toUpperCase(),n=Math.abs(Number(tx.amount||0));if(['PAY','GOV_PAY','TAX','STOCK_BUY'].includes(type))return-n;if(['SALARY','INTEREST_B','DISTRIB','STOCK_SELL'].includes(type))return n;return Number(tx.amount||0)}
function fmtAt(v,dateOnly){const s=String(v||'').trim(),m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);if(!m)return s;const d=`${Number(m[2])}月${Number(m[3])}日`;return dateOnly||!m[4]?d:`${d} ${String(m[4]).padStart(2,'0')}:${m[5]}`}
function renderHistory(tx){document.getElementById('history').innerHTML=(tx||[]).map(x=>{const n=signedAmount(x),type=String(x.type||'').toUpperCase();return `<div class="tx"><div class="txIcon">${icons[type]||'💎'}</div><div><div class="txTitle">${esc(labels[type]||type||'取引')}</div><div class="txMeta">${esc(fmtAt(x.at))}${x.shopName?'　'+esc(x.shopName):''}${x.note?'<br>'+esc(x.note):''}</div></div><div class="txAmount ${n<0?'minus':'plus'}">${n>0?'+':''}${n.toLocaleString()} Pay</div></div>`}).join('')||'<div class="loading">取引履歴はありません</div>'}
async function loadBase(){try{BASE=String(await call('getBaseUrlForClient')||'').replace(/\?p=.*$/,'').replace(/\?$/,'');document.getElementById('btnBackHome').href=BASE+'?p=home'}catch(e){document.getElementById('btnBackHome').href='#'}}
async function initialLoad(){try{const d=await call('api_getActivePayOptions');users=d.users||[];shops=d.shops||[];document.getElementById('uid').innerHTML='<option value="">ユーザーを選択</option>'+users.map(x=>`<option value="${esc(x.userId)}">${esc(x.userId)}　${esc(x.name)}</option>`).join('');document.getElementById('stockShop').innerHTML='<option value="">会社を選択</option>'+shops.map(x=>`<option value="${esc(x.shopId)}">${esc(x.shopName)}</option>`).join('')}catch(e){msg('loginMsg','一覧を読み込めませんでした：'+e.message,false)}}
async function login(){try{const uid=document.getElementById('uid').value,pin=document.getElementById('pin').value.trim();if(!uid)throw new Error('ユーザーを選択してください');current={uid,pin};const r=await call('api_balance',uid,pin,100);document.getElementById('userName').textContent=r.name+' さん';document.getElementById('userBalance').textContent=Number(r.balance).toLocaleString();renderMemberships(r.membershipHistory||[],r.retirementApplications||[]);renderHistory(r.tx);['profile','stock','application','historyCard','civicCard'].forEach(id=>document.getElementById(id).classList.remove('hidden'));msg('loginMsg','認証しました',true);loadMembers();loadCivic().catch(e=>{document.getElementById('civicTasks').textContent=e.message});if(document.getElementById('stockShop').value)await loadStock()}catch(e){msg('loginMsg',e.message,false)}}
function renderMemberships(rows,apps){const pending=new Set(apps.filter(x=>x.status==='PENDING').map(x=>x.shopId)),active=rows.filter(x=>x.isActive);document.getElementById('companies').innerHTML=active.length?active.map(x=>`<div class="membership"><span><b>${esc(x.shopName)}</b><br><small>${x.role==='PRESIDENT'?'社長':'社員'}／入社 ${esc(fmtAt(x.joinedAt))}</small></span>${x.role==='PRESIDENT'?'<span class="chip">社長は先生に相談</span>':pending.has(x.shopId)?'<span class="chip">退職届を審査中</span>':`<button class="smallBtn danger" onclick="submitRetirement('${esc(x.shopId)}','${esc(x.shopName)}')">退職届を出す</button>`}</div>`).join(''):'<span class="loading">所属会社はありません</span>';const statusLabel={PENDING:'社長の確認待ち',APPROVED:'承認・退職済み',REJECTED:'却下'};document.getElementById('retirementApplications').innerHTML=apps.length?apps.map(x=>`<div class="membership"><span><b>${esc(x.shopName)}</b>　<span class="chip">${esc(statusLabel[x.status]||x.status)}</span><br><small>提出 ${esc(fmtAt(x.submittedAt))}／理由：${esc(x.reason)}${x.reviewedAt?'<br>審査 '+esc(fmtAt(x.reviewedAt))+(x.reviewNote?'／社長コメント：'+esc(x.reviewNote):''):''}</small></span></div>`).join(''):'<span class="loading">提出した退職届はありません</span>';document.getElementById('membershipHistory').innerHTML=rows.length?rows.map(x=>`<div class="membership"><span><b>${esc(x.shopName)}</b>　${x.role==='PRESIDENT'?'社長':'社員'}<br><small>入社 ${esc(fmtAt(x.joinedAt))}${x.leftAt?' ／ 退社 '+esc(fmtAt(x.leftAt))+'（'+esc(x.leaveReason||'退社')+'）':' ／ 在籍中'}</small></span></div>`).join(''):'<span class="loading">履歴はありません</span>'}
async function submitRetirement(shopId,shopName){const reason=prompt(`${shopName}の社長へ提出する退職理由を書いてください。`);if(reason===null)return;if(!reason.trim()){msg('loginMsg','退職理由を入力してください',false);return}if(!confirm(`${shopName}へ退職届を提出しますか？\n社長の承認後に退職となります。`))return;try{const r=await call('api_submitRetirementApplication',{userId:current.uid,pin:current.pin,shopId,reason});msg('loginMsg',r.message,true);await login()}catch(e){msg('loginMsg',e.message,false)}}
function loadMembers(){document.getElementById('members').innerHTML=users.filter(x=>x.userId!==current.uid).map(x=>`<label class="memberOption"><input class="memberCheck" type="checkbox" value="${esc(x.userId)}" onchange="updateMemberSummary()"><span><span class="memberName">${esc(x.name)}</span><br><small>${esc(x.userId)}</small></span></label>`).join('')||'<div class="loading">選択できる児童がいません</div>';updateMemberSummary()}
function selectedMembers(){return [...document.querySelectorAll('.memberCheck:checked')].map(x=>x.value)}
function updateMemberSummary(){const ids=selectedMembers(),names=ids.map(id=>{const u=users.find(x=>x.userId===id);return u?u.name:id});document.getElementById('memberSummary').textContent=`選択中：${ids.length}人${names.length?'（'+names.join('、')+'）':''}`}
async function loadCivic(){if(!current)return;const d=await call('api_userCivicDashboard',current.uid,current.pin);document.getElementById('civicTasks').innerHTML=(d.tasks||[]).map(x=>`<div class="notice"><b>${esc(x.title)}</b><br><small>${esc(x.detail||'')}</small></div>`).join('')||'<span class="loading">今すぐ行う手続きはありません</span>';document.getElementById('civicNotices').innerHTML=(d.notices||[]).map(x=>`<div class="notice"><b>${esc(x.title||'お知らせ')}</b><br><small>${esc(x.detail||x.message||'')}</small></div>`).join('')||'<span class="loading">新しいお知らせはありません</span>';const g=d.government||{},t=g.totals||{};document.getElementById('civicBudget').innerHTML=`<div class="budget">${Number(g.balance||0).toLocaleString()} Pay</div><small>現在の政府残高（最近30件の集計）</small><div class="notice">税金収入　<b>${Number(t.tax||0).toLocaleString()} Pay</b></div><div class="notice">権利料収入　<b>${Number(t.rights||0).toLocaleString()} Pay</b></div><div class="notice">利息の支出　<b>${Number(t.interest||0).toLocaleString()} Pay</b></div><div class="notice">会社支援金　<b>${Number(t.support||0).toLocaleString()} Pay</b></div>`;renderCivicRules(d.rules||[])}
function renderCivicRules(rows){const labels={PROPOSED:'先生の確認待ち',VOTING:'投票中',ADOPTED:'採択',REJECTED:'否決'};document.getElementById('civicRules').innerHTML=rows.length?rows.map(x=>`<div class="rule"><b>${esc(x.title)}</b>　<span class="chip">${esc(labels[x.status]||x.status)}</span><p>${esc(x.reason)}<br><small>よくなること：${esc(x.benefit)}</small></p><div>賛成 ${Number(x.votes?.yes||0)}／反対 ${Number(x.votes?.no||0)}／棄権 ${Number(x.votes?.abstain||0)}</div>${x.status==='VOTING'?`<div class="ruleActions"><button onclick="voteRule('${esc(x.proposalId)}','YES')">賛成</button><button class="danger" onclick="voteRule('${esc(x.proposalId)}','NO')">反対</button><button class="sell" onclick="voteRule('${esc(x.proposalId)}','ABSTAIN')">棄権</button></div>`:''}${x.myVote?`<small>あなたの投票：${esc(x.myVote)}</small>`:''}${x.effectiveAt?`<small>施行日：${esc(fmtAt(x.effectiveAt,true))}</small>`:''}</div>`).join(''):'<span class="loading">ルール提案はまだありません</span>'}
async function voteRule(proposalId,vote){if(!confirm(`「${vote==='YES'?'賛成':vote==='NO'?'反対':'棄権'}」で投票しますか？（投票中は変更できます）`))return;try{await call('api_voteRule',current.uid,current.pin,proposalId,vote);await loadCivic()}catch(e){msg('ruleMsg',e.message,false)}}
async function submitRuleProposal(){try{const r=await call('api_submitRuleProposal',{userId:current.uid,pin:current.pin,title:document.getElementById('ruleTitle').value,reason:document.getElementById('ruleReason').value,benefit:document.getElementById('ruleBenefit').value,concern:document.getElementById('ruleConcern').value});msg('ruleMsg',r.message,true);['ruleTitle','ruleReason','ruleBenefit','ruleConcern'].forEach(id=>document.getElementById(id).value='');await loadCivic()}catch(e){msg('ruleMsg',e.message,false)}}
async function loadStock(){const shopId=document.getElementById('stockShop').value;if(!shopId||!current){currentQuote=null;document.getElementById('stockInfo').textContent='会社を選んでください';return}try{const r=await call('api_stockHolding',current.uid,current.pin,shopId);currentQuote=r.quote;const p=r.quote.policy||{},remaining=r.tradeStatus?.remaining;document.getElementById('stockInfo').innerHTML=`<div class="stockQuote"><div class="quote">買値<b>${Number(r.quote.buyPrice).toLocaleString()} Pay</b></div><div class="quote">売値<b>${Number(r.quote.sellPrice).toLocaleString()} Pay</b></div><div class="quote">保有株数<b>${Number(r.holding.shares).toLocaleString()}株</b></div></div><div class="policy">会社活動評価：${r.quote.activityScore==null?'未評価（中立）':Number(r.quote.activityScore)+' / 10点'}<br>今週あと ${remaining==null?'—':Number(remaining)} 回売買できます。購入後 ${Number(p.holdDays||0)} 日間は売却できません。1人が持てるのは発行株数の ${Number(p.maxOwnershipPercent||0)}% までです。</div>`;msg('stockMsg','',true)}catch(e){currentQuote=null;msg('stockMsg',e.message,false)}}
async function trade(side){try{if(!currentQuote)throw new Error('先に会社を選択してください');const shares=Math.floor(Number(document.getElementById('shares').value));if(!(shares>0))throw new Error('株数は1以上で入力してください');const shopId=currentQuote.shopId,price=side==='BUY'?currentQuote.buyPrice:currentQuote.sellPrice,total=shares*price;if(!confirm(`${shares}株を、1株${price} Pay（合計${total} Pay）で${side==='BUY'?'購入':'売却'}しますか？`))return;await call(side==='BUY'?'api_stockBuy':'api_stockSell',current.uid,current.pin,shopId,shares,price);msg('stockMsg',`${side==='BUY'?'購入':'売却'}しました`,true);await login();document.getElementById('stockShop').value=shopId;await loadStock();await loadRanking()}catch(e){msg('stockMsg',e.message,false)}}
async function submitApplication(){try{const memberUserIds=selectedMembers();const names=memberUserIds.map(id=>{const u=users.find(x=>x.userId===id);return u?u.name:id});if(!confirm(`社員${memberUserIds.length}人${names.length?'（'+names.join('、')+'）':''}で会社設立を申請しますか？`))return;const r=await call('api_submitCompanyApplicationV2',{companyName:document.getElementById('companyName').value,activity:document.getElementById('activity').value,companyPass:document.getElementById('companyPass').value,presidentUserId:current.uid,pin:current.pin,memberUserIds});msg('appMsg','申請しました。申請番号：'+r.applicationId,true)}catch(e){msg('appMsg',e.message,false)}}
async function loadRanking(){try{const r=await call('api_companyRanking');document.getElementById('ranking').innerHTML=r.map(x=>`<div class="rank"><b>${x.rank}位</b><span><b>${esc(x.shopName)}</b><br><small>成長 ${x.growthAmount>=0?'+':''}${Number(x.growthAmount).toLocaleString()}／価値創出 ${Number(x.valueCreated).toLocaleString()}</small></span><b>${Number(x.balance).toLocaleString()} Pay</b></div>`).join('')||'会社がありません'}catch(e){document.getElementById('ranking').textContent=e.message}}
loadBase();initialLoad();loadRanking();
</script></body></html>

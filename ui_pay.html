<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== 全画面基本（HOME/会社ページと同系統） ===== */
html, body{ margin:0; padding:0; width:100%; height:100%; }
body{
  min-height:100svh;
  background: linear-gradient(180deg, #f5f9ff, #eef3fb);
  color:#1f2937;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
}

.app{
  min-height:100svh;
  display:flex;
  flex-direction:column;
}

/* ===== ヘッダー ===== */
.posHeader{
  position:sticky;
  top:0;
  z-index:10;

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;

  padding: calc(14px + env(safe-area-inset-top)) 14px 14px;
  background: rgba(255,255,255,.88);
  backdrop-filter: blur(12px);
  border-bottom:1px solid #dbeafe;

  max-width:2400px;
  margin:0 auto;
  width:100%;
  box-sizing:border-box;
}

.brand{ display:flex; align-items:center; gap:12px; min-width:0; }
.logo{
  width:44px; height:44px;
  border-radius:16px;
  display:grid; place-items:center;
  background:#e0ecff;
  box-shadow: 0 8px 18px rgba(30,64,175,.18);
  font-size:22px;
}
.title{ font-size:22px; font-weight:900; color:#1e3a8a; }
.sub{
  font-size:12px; color:#475569;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:55vw;
}

.status{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
.pill{
  font-size:12px; font-weight:800;
  padding:8px 12px;
  border-radius:999px;
  background:#e0ecff;
  color:#1e40af;
  border:1px solid #bfdbfe;
}
.time{
  font-size:16px; font-weight:900;
  color:#1f2937;
  font-variant-numeric: tabular-nums;
}

/* ===== メイン ===== */
.main{
  flex:1;
  padding:14px;
  padding-bottom: calc(14px + env(safe-area-inset-bottom));
  max-width:2400px;
  margin:0 auto;
  width:100%;
  box-sizing:border-box;
}

/* ===== 共通カード ===== */
.card{
  border-radius:20px;
  padding:18px;
  background:#ffffff;
  border:1px solid #dbeafe;
  box-shadow: 0 14px 28px rgba(30,64,175,.12);
}
.card h1{
  margin:0 0 6px 0;
  font-size:22px;
  font-weight:900;
  color:#1e3a8a;
}
.muted{ color:#64748b; font-size:13px; margin:0; }

label{
  display:block;
  margin-top:12px;
  font-size:12px;
  font-weight:900;
  color:#334155;
}

/* ===== 入力 ===== */
input, select{
  width:100%;
  box-sizing:border-box;
  margin-top:6px;
  padding:12px 12px;
  border-radius:14px;
  border:1px solid #bfdbfe;
  background:#f8fbff;
  color:#0f172a;
  font-size:16px;
  outline:none;
}
input:focus, select:focus{
  border-color:#60a5fa;
  box-shadow: 0 0 0 4px rgba(59,130,246,.15);
}
.mono{
  font-variant-numeric: tabular-nums;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
}

/* ===== レイアウト（入力2列：狭い画面は縦） ===== */
.formGrid{
  display:grid;
  grid-template-columns: 1fr;
  gap:12px;
  margin-top:10px;
}
@media (min-width: 620px){
  .formGrid{
    grid-template-columns: 1fr 1fr;
  }
}

/* ===== ボタン（a/ button 共通） ===== */
.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  margin-top:12px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;

  border-radius:16px;
  padding:12px 14px;
  font-size:16px;
  font-weight:900;

  border:1px solid #bfdbfe;
  background:#e0ecff;
  color:#1e40af;
  box-shadow: 0 10px 22px rgba(30,64,175,.14);
  touch-action: manipulation;

  text-decoration:none;
  cursor:pointer;
  user-select:none;
}
.btn:active{ transform: scale(.99); }

.btn.primary{
  background:#1a73e8;
  color:#fff;
  border-color:#1a73e8;
}

.btn.secondary{
  background:#ffffff;
  color:#1e40af;
  border-color:#bfdbfe;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* ===== メッセージ ===== */
.err{
  margin:10px 0 0 0;
  padding:10px 12px;
  border-radius:14px;
  background:#fee2e2;
  border:1px solid #fca5a5;
  color:#991b1b;
  font-weight:800;
}
.ok{
  margin:10px 0 0 0;
  padding:10px 12px;
  border-radius:14px;
  background:#dcfce7;
  border:1px solid #86efac;
  color:#166534;
  font-weight:900;
}

hr{
  border:0;
  border-top:1px solid #e2e8f0;
  margin:14px 0;
}

/* ===== 結果カード ===== */
.resultCard{
  margin-top:14px;
}

/* ===== ローディング（スケルトン） ===== */
.skel{
  background:#eee;
  border-radius:10px;
  position:relative;
  overflow:hidden;
}
.skel::after{
  content:"";
  position:absolute;
  top:0; left:-40%;
  width:40%; height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent);
  animation:skelMove 1.1s infinite;
}
@keyframes skelMove{
  0%{ left:-40%; }
  100%{ left:100%; }
}
.pay-loading .skel-title{ height:22px; width:55%; }
.pay-loading .skel-line{ height:14px; margin:10px 0; }
.pay-loading .skel-big { height:30px; width:70%; margin-top:10px; }
</style>
</head>

<body>
<div class="app">

  <header class="posHeader">
    <div class="brand">
      <div class="logo">💎</div>
      <div style="min-width:0">
        <div class="title">ClassPay <span style="font-size:11px;background:#1e40af;color:#fff;padding:3px 7px;border-radius:999px;vertical-align:middle">v3.3</span></div>
        <div class="sub">学級内通貨のデジタル決済　クラスペイ</div>
      </div>
    </div>
    <div class="status">
      <div class="pill">支払い</div>
      <div class="time" id="nowTime">--:--</div>
    </div>
  </header>

  <main class="main">
    <div class="card">
      <h1>ClassPay　クラスペイ</h1>
      <p class="muted">会社ページから来た場合、会社IDは自動入力されます。PINが一致した本人だけ支払えます。</p>

      <label>ユーザーID（例: U001）</label>
     <select id="userId" class="mono">
  <option value="">ユーザーを選択</option>
</select>

      <label>PIN（暗証番号）</label>
      <input id="pin"
        class="mono"
        type="password"
        inputmode="numeric"
        autocomplete="new-password"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="4けた" />

      <div class="formGrid">
        <div>
          <label>会社ID（例: S001）</label>
          <select id="shopId" class="mono">
  <option value="">会社を選択</option>
</select>
        </div>
        <div>
          <label>金額</label>
          <input id="amount" type="number" inputmode="numeric" min="0" step="1" placeholder="例：10" />
        </div>
      </div>

      <label>メモ（任意）</label>
      <input id="note" placeholder="例：小物" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />

      <div class="actions">
        <button type="button" id="btnPay" class="btn primary">支払う</button>
        <a class="btn secondary" href="#" id="btnBackHome">戻る</a>
      </div>

      <div id="result" class="card resultCard" style="display:none"></div>
      <div id="msg"></div>
    </div>
  </main>
</div>

<script>
let BASE = "";

/* ===== 共通 ===== */
function escapeHtml_(s){
  return String(s)
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function fmtAt_(v,dateOnly){const s=String(v||'').trim(),m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);if(!m)return s;const d=`${Number(m[2])}月${Number(m[3])}日`;return dateOnly||!m[4]?d:`${d} ${String(m[4]).padStart(2,'0')}:${m[5]}`}

function showErr(e){
  document.getElementById("msg").innerHTML = `<p class="err">${escapeHtml_(e.message || e)}</p>`;
}
function showOk(t){
  document.getElementById("msg").innerHTML = `<p class="ok">${escapeHtml_(t)}</p>`;
}

function buildUrl(p, params){
  if(!BASE) return "#";
  const url = new URL(BASE);
  url.searchParams.set("p", p);
  if (params && typeof params === "object") {
    Object.keys(params).forEach(key => {
      const val = params[key];
      if (val !== undefined && val !== null && val !== "") {
        url.searchParams.set(key, String(val));
      }
    });
  }
  return url.toString();
}

function call(name, ...args){
  return new Promise((resolve, reject) => {
    let runner = google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject);
    runner[name](...args);
  });
}

function loadBase_(){
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(function(baseUrl){
        let v = String(baseUrl || "").trim();
        if (!v) {
          reject(new Error("BASE_URL が空です。"));
          return;
        }
        v = v.replace(/\?p=.*$/, "");
        v = v.replace(/\?$/, "");
        BASE = v;
        resolve(BASE);
      })
      .withFailureHandler(reject)
      .getBaseUrlForClient();
  });
}
async function loadPayOptions_(provided){
  const data = provided || await call("api_getActivePayOptions");

  const userSelect = document.getElementById("userId");
  const shopSelect = document.getElementById("shopId");

  userSelect.innerHTML = `<option value="">ユーザーを選択</option>`;
  shopSelect.innerHTML = `<option value="">会社を選択</option>`;

  data.users.forEach(u => {
    const opt = document.createElement("option");
    opt.value = u.userId;
    opt.textContent = `${u.userId}　${u.name}`;
    userSelect.appendChild(opt);
  });

  (data.recipients || data.shops).forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.shopId;
    opt.textContent = `${s.shopId}　${s.shopName}`;
    shopSelect.appendChild(opt);
  });
}
/* ===== 時計 ===== */
function tick(){
  const d = new Date();
  const hh = String(d.getHours()).padStart(2,"0");
  const mm = String(d.getMinutes()).padStart(2,"0");
  document.getElementById("nowTime").textContent = `${hh}:${mm}`;
}
tick();
setInterval(tick, 1000);

/* ====== 支払い中トグル（ボタン） ====== */
function payBusy_(busy){
  const btn = document.getElementById("btnPay");
  if (!btn) return;
  btn.disabled = !!busy;
  btn.style.opacity = busy ? "0.75" : "1";
  btn.textContent = busy ? "支払い中..." : "支払う";
}

/* ====== 結果カード内ローディング（スケルトン） ====== */
function renderPayLoadingCard_(){
  const box = document.getElementById("result");
  box.style.display = "block";
  box.innerHTML = `
    <div class="pay-loading" aria-busy="true">
      <div class="skel skel-title"></div>
      <div class="skel skel-line" style="width:35%"></div>
      <div class="skel skel-line" style="width:60%"></div>
      <hr>
      <div class="skel skel-big"></div>
      <div class="skel skel-line" style="width:75%"></div>
      <div class="skel skel-line" style="width:65%"></div>
    </div>
  `;
}

async function pay(){
  try{
    document.getElementById("msg").innerHTML = "";
    payBusy_(true);
    renderPayLoadingCard_();

    const userId = document.getElementById("userId").value.trim().toUpperCase();
    const pin    = document.getElementById("pin").value.trim();
    const shopId = document.getElementById("shopId").value.trim().toUpperCase();
    const amount = Number(document.getElementById("amount").value);
    const note   = document.getElementById("note").value.trim();

    if (!userId) throw new Error("ユーザーIDを入力してください");
    if (!pin) throw new Error("PINを入力してください");
    if (!shopId) throw new Error("会社IDを入力してください");
    if (!Number.isFinite(amount) || amount <= 0) throw new Error("金額を正しく入力してください");
    if (!Number.isInteger(amount)) throw new Error("金額は整数で入力してください");

    const r = await call("api_pay", userId, pin, shopId, amount, note);

    const box = document.getElementById("result");
    box.style.display = "block";
    box.innerHTML = `
      <div class="ok">決済完了</div>
      <div class="muted" style="margin-top:8px">日時: ${escapeHtml_(fmtAt_(r.at))}</div>
      <div class="muted">取引ID: <span class="mono">${escapeHtml_(r.txId)}</span></div>
      <hr>
      <div style="font-weight:900; color:#0f172a">あなた：${escapeHtml_(r.user.name)}（残高 ${escapeHtml_(r.user.balance)}）</div>
      <div style="font-weight:900; color:#0f172a; margin-top:6px">支払先：${escapeHtml_(r.shop.shopName)}（残高 ${escapeHtml_(r.shop.balance)}）</div>
    `;

    document.getElementById("pin").value = "";

  }catch(e){
    showErr(e);
    const box = document.getElementById("result");
    box.style.display = "none";
    box.innerHTML = "";
  }finally{
    payBusy_(false);
  }
}

/* ===== 初期化 ===== */
(async function init(){
  try{
    const boot=await call("api_pageBootstrapV31","pay");
    BASE=String(boot.baseUrl||"").replace(/\?p=.*$/,'').replace(/\?$/,'');
    if(!BASE)throw new Error("BASE_URL が空です。");
    await loadPayOptions_(boot.options||{});
    document.getElementById("btnBackHome").href = buildUrl("home");

    const sp = new URLSearchParams(location.search);
    const sid = (typeof params !== "undefined" && params && params.shopId)
      ? params.shopId
      : sp.get("shopId");

    if (sid) {
      document.getElementById("shopId").value = sid;
    }

    document.getElementById("btnPay").addEventListener("click", pay);

    ["pin","amount","note"].forEach(id=>{
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener("keydown", (ev)=>{
        if (ev.key === "Enter") pay();
      });
    });

  }catch(e){
    console.error(e);
    showErr(e.message || "BASE_URL の読み込みに失敗しました。");
    document.getElementById("btnPay").disabled = true;
    document.getElementById("btnBackHome").href = "#";
  }
})();

</script>

</body>
</html>

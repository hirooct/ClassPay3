<!doctype html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,"BIZ UDPGothic",sans-serif;margin:0;background:#f6f7f9;}
    .wrap{max-width:560px;margin:0 auto;padding:16px;}
    .card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 6px 16px rgba(0,0,0,.06);margin:12px 0;}
    h1{font-size:20px;margin:0 0 8px;}
    label{display:block;font-size:12px;margin:10px 0 6px;color:#444;}
    input,select,button{width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;font-size:16px;box-sizing:border-box;}
    button{border:none;background:#111;color:#fff;font-weight:700;cursor:pointer;}
    button.secondary{background:#e9eaee;color:#111;}
    .row{display:flex;gap:10px;}
    .row>*{flex:1;}
    .muted{color:#666;font-size:13px;}
    .ok{color:#0a7a2f;font-weight:700;}
    .err{color:#b00020;font-weight:700;}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;}
    .qrimg{width:320px;max-width:100%;border-radius:12px;border:1px solid #eee;}
    hr{border:none;border-top:1px solid #eee;margin:12px 0;}
    a.btn{display:block;width:100%;padding:12px;border-radius:12px;text-align:center;text-decoration:none;font-weight:700;box-sizing:border-box;background:#111;color:#fff}
    a.btn.secondary{background:#e9eaee;color:#111;}
    /* 会社情報 強調表示 */
.shop-card {
  text-align: center;
}

/* 会社名 */
.shop-title {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 6px;
}

/* 会社ID */
.shop-id {
  font-size: 14px;
  color: #666;
}

/* 残高 */
.shop-balance {
  margin: 12px 0 16px;
}

.shop-balance .label {
  font-size: 14px;
  color: #666;
}

.shop-balance .amount {
  font-size: 36px;
  font-weight: bold;
  color: #2c7be5;
}

/* URL折返し */
.shop-card .url {
  word-break: break-all;
}

  </style>
</head>

<body>
  <script>
    // ★includeより前に定義（白画面・params未定義を防ぐ）
    var params = <?!= JSON.stringify(params || {}) ?>;
    window.params = params;

    window.call = window.call || function(func, ...args){
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(err => reject(new Error(err && err.message ? err.message : String(err))))
          [func](...args);
      });
    };
  </script>

  <div class="wrap">
    <?!= include_("ui_" + page); ?>
  </div>
</body>
</html>
